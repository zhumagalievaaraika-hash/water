<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Су инспекторлары</title>
<style>
:root{--bg:#dff1fb;--panel:#fff;--ink:#17324d;--mut:#5b7186;--acc:#2f7de1;--line:#b9d9ee;--ok:#2e9d5b;--bad:#d9345a}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs,1))}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(#bfe4f7,var(--bg) 260px);min-height:100vh;line-height:1.5}
header{padding:18px 20px 6px;max-width:1100px;margin:auto;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
header>div:first-child{flex:1 1 380px}
h1{margin:0;font-size:1.7rem}
header p{margin:4px 0 0;color:var(--mut)}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb button{font:inherit;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink);padding:6px 11px;border-radius:10px;cursor:pointer}
.tb button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
nav{max-width:1100px;margin:12px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
nav button{border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:1100px;margin:14px auto 40px;padding:0 20px}
section{display:none}section.on{display:block}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px}
.panel h2{margin:0 0 10px;font-size:1.1rem}
button.act,.chip{font:inherit;font-weight:700;border-radius:12px;cursor:pointer;border:2px solid var(--acc);background:#fff;color:var(--acc);padding:9px 12px}
button.act:hover,.chip:hover{background:#eef5ff}
button:focus-visible,input:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.chip[aria-pressed=true]{background:var(--acc);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.acid{border-color:var(--bad)!important;color:var(--bad)!important}.base{border-color:#3b6fd0!important;color:#3b6fd0!important}.ind{border-color:#7a3fc0!important;color:#7a3fc0!important}
.bench{display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.read{text-align:center;min-width:130px}
.big{font-size:2.6rem;font-weight:800;line-height:1}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-weight:700;font-size:.9rem}
.scale{display:flex;border-radius:10px;overflow:hidden;margin-top:8px;position:relative}
.scale div{flex:1;text-align:center;font-size:.72rem;padding:6px 0;color:#fff;font-weight:700}
.mark{position:absolute;top:-6px;width:0;height:0;border:7px solid transparent;border-top:10px solid var(--ink);transform:translateX(-50%);transition:left .4s}
.note{color:var(--mut);font-size:.92rem;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;border:1px solid #0003}
label{font-weight:700;display:block;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--acc)}
.eq{background:#f2f8fd;border-radius:10px;padding:8px 12px;font-family:Consolas,monospace;font-size:.88rem;margin:6px 0}
svg{max-width:100%;height:auto;display:block}
.fz{animation:rise 1.3s ease-out forwards}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-70px);opacity:0}}
.q{margin:12px 0}.q button{display:block;width:100%;text-align:left;margin:6px 0;font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.q button.ok{background:#dff6e8;border-color:var(--ok)}.q button.no{background:#fde4ea;border-color:var(--bad)}
/* режим для слабовидящих */
body.lv{background:#000;color:#fff;line-height:1.75;letter-spacing:.02em}
.lv header p,.lv .note{color:#fff}
.lv .panel{background:#000;border:3px solid #ffeb3b}
.lv button.act,.lv .chip,.lv nav button,.lv .q button,.lv .tb button{background:#000;color:#ffeb3b!important;border:3px solid #ffeb3b!important}
.lv .chip[aria-pressed=true],.lv nav button[aria-selected=true],.lv .tb button[aria-pressed=true]{background:#ffeb3b;color:#000!important}
.lv .eq{background:#222;color:#fff}
.lv td,.lv th{border-bottom:2px solid #ffeb3b}
.lv .scale div{font-size:.9rem;text-shadow:0 0 3px #000,0 0 3px #000}
.lv .mark{border-top-color:#fff}
.lv .q button.ok{background:#003d1a;border-color:#4cff88!important}.lv .q button.no{background:#4a0010;border-color:#ff7a95!important}
.lv input[type=range]{height:28px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
  </div>
  <div class="tb" role="toolbar" data-a="tools">
    <span role="group" data-a="lang" style="display:flex;gap:6px">
      <button data-l="kk" aria-pressed="false">ҚАЗ</button>
      <button data-l="ru" aria-pressed="true">РУС</button>
      <button data-l="en" aria-pressed="false">ENG</button>
    </span>
    <button id="lv" aria-pressed="false" data-i="lv">👁</button>
    <button id="fm" data-a="fm">A−</button>
    <button id="fp" data-a="fp">A+</button>
    <button id="rd" aria-pressed="false" data-i="read">🔊</button>
  </div>
</header>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="lab" data-i="t_lab"></button>
  <button role="tab" aria-selected="false" data-t="rain" data-i="t_rain"></button>
  <button role="tab" aria-selected="false" data-t="theory" data-i="t_theory"></button>
  <button role="tab" aria-selected="false" data-t="quiz" data-i="t_quiz"></button>
</nav>
<main>

<section id="lab" class="on">
 <div class="grid">
  <div class="panel">
    <h2 data-i="lab1"></h2>
    <div class="row" id="samples"></div>
    <div class="bench">
      <svg viewBox="0 0 200 250" width="260" role="img" data-a="glass">
        <defs><clipPath id="cp"><path d="M40 40 L48 215 Q50 228 64 228 H136 Q150 228 152 215 L160 40 Z"/></clipPath></defs>
        <g clip-path="url(#cp)"><rect id="liq" x="30" y="110" width="140" height="130" fill="#cfe9f5" style="transition:fill .6s,y .4s"/></g>
        <path d="M40 40 L48 215 Q50 228 64 228 H136 Q150 228 152 215 L160 40" fill="none" stroke="#6a8aa5" stroke-width="4" stroke-linecap="round"/>
        <path d="M44 40 H156" stroke="#6a8aa5" stroke-width="4" stroke-linecap="round"/>
        <g id="bub"></g>
      </svg>
      <div class="read" aria-live="polite">
        <div class="note" data-i="phm"></div>
        <div class="big" id="phv">—</div>
        <div id="phk" style="margin-top:6px"></div>
      </div>
    </div>
    <div class="scale" id="scale"><div class="mark" id="mark" style="left:50%"></div></div>
    <p class="note" id="msg" aria-live="polite"></p>
  </div>

  <div>
   <div class="panel">
    <h2 data-i="lab2"></h2>
    <div class="row">
      <button class="act ind" id="bInd" data-i="b_ind"></button>
      <button class="act acid" id="bVin" data-i="b_vin"></button>
      <button class="act base" id="bSoda" data-i="b_soda"></button>
      <button class="act" id="bReset" data-i="b_reset"></button>
    </div>
    <div class="eq" data-i="eq1"></div>
    <p class="note" data-h="added"></p>
    <label><input type="checkbox" id="showph" checked> <span data-i="showph"></span></label>
   </div>
   <div class="panel" style="margin-top:16px">
    <h2 data-i="lab3"></h2>
    <button class="act" id="bLog" data-i="b_log"></button>
    <table><thead><tr><th data-i="th1"></th><th data-i="th2"></th><th>pH</th><th data-i="th4"></th></tr></thead><tbody id="log"></tbody></table>
    <p class="note" id="logEmpty" data-i="log_empty"></p>
   </div>
  </div>
 </div>
</section>

<section id="rain">
 <div class="grid">
  <div class="panel">
    <h2 data-i="rain_h"></h2>
    <svg id="scene" viewBox="0 0 600 320" role="img" data-a="scene"></svg>
  </div>
  <div class="panel">
    <label for="em"><span data-i="em_l"></span> <span id="emv">30</span>%</label>
    <input type="range" id="em" min="0" max="100" value="30">
    <label for="ls"><span data-i="ls_l"></span> <span id="lsv">20</span>%</label>
    <input type="range" id="ls" min="0" max="100" value="20">
    <div class="eq" data-h="eq_rain"></div>
    <table aria-live="polite">
      <tr><td data-i="r_ph"></td><td><b id="rp"></b> <span class="dot" id="rdot"></span></td></tr>
      <tr><td data-i="r_lake"></td><td><b id="lp"></b></td></tr>
      <tr><td data-i="r_fish"></td><td><b id="fs"></b></td></tr>
    </table>
    <p id="eff" style="font-weight:700" aria-live="polite"></p>
    <p class="note" data-i="rain_note"></p>
  </div>
 </div>
</section>

<section id="theory">
 <div class="grid">
  <div class="panel"><h2 data-i="th1h"></h2><p data-i="th1p"></p><div class="scale" id="scale2"></div></div>
  <div class="panel"><h2 data-i="th2h"></h2><p data-i="th2p"></p></div>
  <div class="panel"><h2 data-i="th3h"></h2><p data-i="th3p"></p></div>
  <div class="panel"><h2 data-i="th4h"></h2><p data-i="th4p"></p></div>
 </div>
</section>

<section id="quiz"><div class="panel" id="qbox"></div></section>
</main>

th3h:'Бейтараптану',th3p:'Қышқыл + негіз → тұз + су. Сода сірке суын осылай басады, ал топырақтағы әктас қышқыл жаңбырды жұмсартады.',
th4h:'Экология',th4p:'Қышқыл жаңбыр топырақтан кальций мен магнийді шайып кетеді, улы алюминийді босатады, қылқан жапырақ пен жапырақтарды зақымдайды, ал pH 5-тен төмен көлдерде балық уылдырығы мен шабағы өледі.',
qn:'{i}-сұрақ / {n}',next:'Әрі қарай',done:'Дайын!',score:'Дұрыс жауап: <b>{s} / {n}</b>',again:'Қайта өту',
qs:[['Сірке суындағы қырыққабат индикаторы қандай түс береді?',['Қызыл/қызғылт','Көк','Жасыл']],['Қышқылға сода қосқанда не болады?',['pH кемиді','Бейтараптану: pH 7-ге қарай өседі','Ештеңе өзгермейді']],['Қандай жаңбырды қышқыл деп есептейді?',['pH 5,6-дан төмен','pH 7-ге тең','pH 8-ден жоғары']],['Қандай шығарындылар қышқыл жаңбыр тудырады?',['Оттегі мен азот','SO₂ және NOₓ','Тек су буы']],['Әктасы бар топырақ қышқыл жаңбырға қалай әсер етеді?',['Күшейтеді','Қышқылды бейтараптайды','Әсер етпейді']]]},
en:{title:'Water Inspectors — virtual pH lab',h1:'Water Inspectors: exploring water pH',
sub:'Red cabbage is a natural indicator. Pick a water sample, add the indicator, vinegar and baking soda, then see what acid rain does to nature.',
tools:'Settings',lang:'Language',lv:'👁 Low-vision mode',fm:'Smaller text',fp:'Larger text',read:'🔊 Read aloud',stop:'⏹ Stop',
t_lab:'Lab',t_rain:'Acid rain',t_theory:'Concepts',t_quiz:'Quiz',
lab1:'1. Choose a water sample',glass:'Glass of water',phm:'pH meter',
s0:'Tap water',s1:'Rainwater',s2:'River water',s3:'Spring water',
lab2:'2. Run the experiment',b_ind:'Add indicator',b_vin:'+ Vinegar (acid)',b_soda:'+ Baking soda (base)',b_reset:'Reset',
eq1:'Vinegar and soda: CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂↑',
added:'Added: vinegar <b id="nv">0</b>, soda <b id="nb">0</b>. Acid and base neutralize each other — try bringing the pH back to 7.',
showph:'Show the pH number (turn off and judge by colour)',lab3:'3. Inspector’s log',b_log:'Record measurement',
th1:'Sample',th2:'Colour',th4:'Result',log_empty:'Empty so far. Compare rain, river, spring and tap water.',
m0:'First add the indicator — red cabbage juice.',m1:'Compare the colour with the scale: what is the pH of this water?',m2:'pH is hidden. Judge the acidity by colour, then check the scale.',m3:'Add the indicator before recording.',
k0:'acidic',k1:'neutral',k2:'alkaline',pv:'+vinegar',ps:'+soda',cl:'Colour:',
c:['red','pink','purple','violet','blue','turquoise','green','yellow-green'],
rain_h:'Model: factory → rain → nature',scene:'Acid rain diagram',em_l:'Factory emissions (SO₂, NOₓ):',ls_l:'Limestone in soil (natural neutralization):',
eq_rain:'SO₂ + H₂O → H₂SO₃ (sulfuric acid after oxidation)<br>2NO₂ + H₂O → HNO₃ + HNO₂',
r_ph:'Rain pH',r_lake:'Lake and soil pH',r_fish:'Fish in the lake',of8:'{n} of 8',
e1:'The ecosystem is healthy: soil and lake cope well.',e2:'Sensitive species (crayfish, snails) begin to disappear.',e3:'Fish eggs and fry die, needles turn yellow, soil loses calcium.',e4:'The lake is nearly dead and the forest is dying. Neutralization and lower emissions are needed.',
rain_note:'Normal rain is slightly acidic (pH ≈ 5.6) because of dissolved CO₂. Rain with pH below 5.6 is called acid rain.',
lf:'Factory',lw:'Forest and soil',ll:'Lake',
th1h:'pH and the scale',th1p:'pH shows how many hydrogen ions H⁺ are in water. pH < 7 is acidic, 7 is neutral, > 7 is alkaline. Each step on the scale means a tenfold change in acidity.',
th2h:'Indicator',th2p:'Red cabbage contains anthocyanins. Their molecules change shape depending on the environment, so the colour changes: red → pink → purple → blue → green → yellow.',
th3h:'Neutralization',th3p:'Acid + base → salt + water. This is how soda calms vinegar, and how limestone in soil softens acid rain.',
th4h:'Ecology',th4p:'Acid rain washes calcium and magnesium out of soil, releases toxic aluminium, damages needles and leaves, and below pH 5 fish eggs and fry die in lakes.',
qn:'Question {i} of {n}',next:'Next',done:'Done!',score:'Correct answers: <b>{s} of {n}</b>',again:'Try again',
qs:[['What colour does cabbage indicator give in vinegar?',['Red/pink','Blue','Green']],['What happens when soda is added to an acid?',['pH decreases','Neutralization: pH rises toward 7','Nothing changes']],['Which rain is considered acid rain?',['pH below 5.6','pH equal to 7','pH above 8']],['Which emissions cause acid rain?',['Oxygen and nitrogen','SO₂ and NOₓ','Only water vapour']],['How does limestone soil affect acid rain?',['Makes it stronger','Neutralizes the acid','No effect']]]}
};
const CORR=[0,1,0,1,1],SPEECH={ru:'ru-RU',kk:'kk-KZ',en:'en-US'};
let L='ru';try{L=localStorage.getItem('lang')||'ru'}catch(e){}
const t=(k,o)=>{let s=D[L][k]??D.ru[k]??k;if(o)for(const x in o)s=s.replace('{'+x+'}',o[x]);return s};

/* ===== цвета ===== */
const STOPS=[[1,'#e11d48'],[2,'#e11d48'],[3,'#e4477f'],[4,'#c4499f'],[5,'#a64fb4'],[6,'#8a52c4'],[7,'#6f55d2'],[8,'#4d68dc'],[9,'#3d8ed2'],[10,'#35b0a8'],[11,'#3cb371'],[12,'#a3c93a'],[13,'#d9d23a']];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function colorAt(p){p=Math.max(1,Math.min(13,p));let i=Math.min(Math.floor(p)-1,11),f=p>=13?1:p-Math.floor(p);
 const a=hex(STOPS[i][1]),b=hex(STOPS[i+1][1]);return 'rgb('+a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(',')+')'}
const kind=p=>p<6.5?[t('k0'),'#c0214a']:p>7.5?[t('k2'),'#2f5fc0']:[t('k1'),'#1f7f48'];
const cname=p=>t('c')[[3.5,5,6.5,7.5,9,10.5,11.5].filter(x=>p>=x).length];
function buildScale(el,m){let h=m?'<div class="mark" id="mark" style="left:50%"></div>':'';for(let i=1;i<=13;i++)h+=`<div style="background:${colorAt(i)}">${i}</div>`;el.innerHTML=h}
buildScale($('#scale'),true);buildScale($('#scale2'),false);

/* ===== Лаборатория ===== */
const SAMPLES=[{ph:7.4,buf:1.2},{ph:5.6,buf:0.2},{ph:7.0,buf:1.5},{ph:7.6,buf:2.0}];
let st={s:0,v:0,b:0,ind:false},logs=[];
const pH=()=>{const S=SAMPLES[st.s];return Math.max(2.4,Math.min(8.6,S.ph-(st.v*0.9-st.b*0.5)/(1+S.buf)))};
function renderSamples(){$('#samples').innerHTML=SAMPLES.map((s,i)=>`<button class="chip" aria-pressed="${i==st.s}" data-i="${i}">${t('s'+i)}</button>`).join('')}
function draw(){
 const p=pH(),k=kind(p);
 $('#liq').setAttribute('fill',st.ind?colorAt(p):'#cfe9f5');
 $('#liq').setAttribute('y',110-Math.min(st.v+st.b,12)*1.5);
 $('#nv').textContent=st.v;$('#nb').textContent=st.b;
 const show=$('#showph').checked&&st.ind;
 $('#phv').textContent=show?p.toFixed(1):'—';
 $('#phk').innerHTML=st.ind?`<span class="tag" style="background:${k[1]}">${k[0]}</span><div class="note">${t('cl')} <b>${cname(p)}</b></div>`:'';
 const mk=$('#mark');mk.style.left=((p-1)/13*100+3.85)+'%';mk.style.display=show?'block':'none';
 $('#msg').textContent=t(st.ind?(show?'m1':'m2'):'m0');
}
function fizz(){let g='';for(let i=0;i<9;i++)g+=`<circle class="fz" cx="${60+Math.random()*80}" cy="${200-Math.random()*40}" r="${2+Math.random()*4}" fill="#fff" style="animation-delay:${Math.random()*.4}s"/>`;
 $('#bub').innerHTML=g;setTimeout(()=>$('#bub').innerHTML='',1700)}
function renderLog(){$('#log').innerHTML=logs.map(r=>{const ex=(r.v?` ${t('pv')} ${r.v}`:'')+(r.b?` ${t('ps')} ${r.b}`:'');
 return `<tr><td>${t('s'+r.s)}${ex}</td><td><span class="dot" style="background:${colorAt(r.p)}"></span> ${cname(r.p)}</td><td>${r.p.toFixed(1)}</td><td>${kind(r.p)[0]}</td></tr>`}).join('');
 $('#logEmpty').style.display=logs.length?'none':'block'}
$('#samples').onclick=e=>{const b=e.target.closest('button');if(!b)return;st={s:+b.dataset.i,v:0,b:0,ind:false};renderSamples();draw()};
$('#bInd').onclick=()=>{st.ind=true;draw()};
$('#bVin').onclick=()=>{if(st.v+st.b<14){st.v++;fizz();draw()}};
$('#bSoda').onclick=()=>{if(st.v+st.b<14){st.b++;fizz();draw()}};
$('#bReset').onclick=()=>{st={s:st.s,v:0,b:0,ind:false};draw()};
$('#showph').onchange=draw;
$('#bLog').onclick=()=>{if(!st.ind){$('#msg').textContent=t('m3');return}
 logs.push({s:st.s,v:st.v,b:st.b,p:pH()});renderLog()};

/* ===== Кислотный дождь ===== */
function rainSim(){
 const e=+$('#em').value,Lm=+$('#ls').value;
 $('#emv').textContent=e;$('#lsv').textContent=Lm;
 const rp=5.6-e*0.021,lp=Math.min(7.2,rp+Lm*0.03),hp=Math.max(0,Math.min(1,(lp-4.5)/2)),fish=Math.round(hp*8);
 $('#rp').textContent=rp.toFixed(1);$('#rdot').style.background=colorAt(rp);
 $('#lp').textContent=lp.toFixed(1);$('#fs').textContent=t('of8',{n:fish});
 const ei=lp>=6.5?1:lp>=5.5?2:lp>=4.5?3:4;
 $('#eff').textContent=t('e'+ei);$('#eff').style.color=ei==1?'#2e9d5b':ei==2?'#b27a00':'#d9345a';
 const rc=colorAt(rp),cl=e>35?'#8e98a4':'#f3f8fc';
 let s=`<rect width="600" height="320" fill="#d6ecf9"/><rect y="250" width="600" height="70" fill="#8a6a44"/>`;
 s+=`<rect x="20" y="170" width="110" height="80" fill="#5f6b78"/><rect x="35" y="120" width="22" height="50" fill="#47515c"/><rect x="85" y="100" width="22" height="70" fill="#47515c"/>`;
 for(let i=0;i<Math.round(e/10)+1;i++)s+=`<circle cx="${46+i*26}" cy="${100-i*9}" r="${10+i*2.5}" fill="#6b7078" opacity="${.25+e/220}"/>`;
 s+=`<ellipse cx="320" cy="60" rx="110" ry="34" fill="${cl}"/><ellipse cx="260" cy="72" rx="60" ry="26" fill="${cl}"/><ellipse cx="380" cy="74" rx="62" ry="24" fill="${cl}"/>`;
 for(let i=0;i<14;i++){const x=230+i*14;s+=`<line x1="${x}" y1="100" x2="${x-8}" y2="140" stroke="${rc}" stroke-width="3" stroke-linecap="round"/><line x1="${x+4}" y1="150" x2="${x-4}" y2="190" stroke="${rc}" stroke-width="3" stroke-linecap="round"/>`}
 const tc=`rgb(${Math.round(150-110*hp)},${Math.round(150*hp+70)},${Math.round(60*hp+40)})`;
 for(let i=0;i<4;i++){const x=170+i*46;s+=`<rect x="${x+9}" y="215" width="8" height="35" fill="#6b4a2a"/><polygon points="${x},220 ${x+13},165 ${x+26},220" fill="${tc}"/><polygon points="${x+2},200 ${x+13},150 ${x+24},200" fill="${tc}"/>`}
 s+=`<ellipse cx="480" cy="275" rx="105" ry="30" fill="${colorAt(lp)}" opacity=".8"/>`;
 for(let i=0;i<fish;i++)s+=`<text x="${420+(i%4)*32}" y="${268+Math.floor(i/4)*18}" font-size="18">🐟</text>`;
 s+=`<g fill="#fff" font-size="15" font-weight="700"><text x="20" y="290">${t('lf')}</text><text x="170" y="290">${t('lw')}</text><text x="440" y="312">${t('ll')}</text></g>`;
 $('#scene').innerHTML=s;
}
$('#em').oninput=rainSim;$('#ls').oninput=rainSim;

/* ===== Тест ===== */
let qi=0,score=0;
function renderQ(){const b=$('#qbox'),qs=D[L].qs;
 if(qi>=qs.length){b.innerHTML=`<h2>${t('done')}</h2><p>${t('score',{s:score,n:qs.length})}</p><button class="act" id="again">${t('again')}</button>`;$('#again').onclick=()=>{qi=0;score=0;renderQ()};return}
 const q=qs[qi];b.innerHTML=`<h2>${t('qn',{i:qi+1,n:qs.length})}</h2><div class="q"><p><b>${q[0]}</b></p>${q[1].map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div>`;
 b.querySelectorAll('.q button').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;
  b.querySelectorAll('.q button').forEach((y,j)=>{y.disabled=true;if(j==CORR[qi])y.classList.add('ok')});
  if(i!=CORR[qi])x.classList.add('no');else score++;
  b.insertAdjacentHTML('beforeend',`<button class="act" id="nx">${t('next')}</button>`);$('#nx').focus();$('#nx').onclick=()=>{qi++;renderQ()}})}

/* ===== Язык ===== */
function applyLang(){
 document.documentElement.lang=L;document.title=t('title');
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $$('[data-h]').forEach(e=>e.innerHTML=t(e.dataset.h));
 $$('[data-a]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.a)));
 $$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==L));
 $('#rd').textContent=t(speaking?'stop':'read');
 renderSamples();draw();renderLog();rainSim();renderQ();
}
$$('[data-l]').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(e){};if(speaking)stopSpeech();applyLang()});

/* ===== Для слабовидящих ===== */
let fs=1;try{fs=+localStorage.getItem('fs')||1}catch(e){}
function setFs(v){fs=Math.max(.85,Math.min(1.8,v));document.documentElement.style.setProperty('--fs',fs);try{localStorage.setItem('fs',fs)}catch(e){}}
function setLv(on){document.body.classList.toggle('lv',on);$('#lv').setAttribute('aria-pressed',on);try{localStorage.setItem('lv',on?1:0)}catch(e){}}
$('#lv').onclick=()=>{const on=!document.body.classList.contains('lv');setLv(on);if(on&&fs<1.25)setFs(1.25)};
$('#fp').onclick=()=>setFs(fs+.15);$('#fm').onclick=()=>setFs(fs-.15);
setFs(fs);try{if(localStorage.getItem('lv')=='1')setLv(true)}catch(e){}

/* ===== Чтение вслух ===== */
let speaking=false;
function stopSpeech(){speechSynthesis.cancel();speaking=false;$('#rd').textContent=t('read');$('#rd').setAttribute('aria-pressed',false)}
$('#rd').onclick=()=>{if(!('speechSynthesis' in window))return;if(speaking){stopSpeech();return}
 const u=new SpeechSynthesisUtterance($('section.on').innerText);u.lang=SPEECH[L];u.onend=stopSpeech;
 speaking=true;$('#rd').textContent=t('stop');$('#rd').setAttribute('aria-pressed',true);speechSynthesis.speak(u)};
if(!('speechSynthesis' in window))$('#rd').style.display='none';

/* ===== Вкладки ===== */
$$('nav button').forEach(b=>b.onclick=()=>{
 $$('nav button').forEach(x=>x.setAttribute('aria-selected',x==b));
 $$('section').forEach(s=>s.classList.toggle('on',s.id==b.dataset.t));
 if(speaking)stopSpeech()});
applyLang();
</script>
</body>
</html>
